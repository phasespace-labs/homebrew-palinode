name: Formula CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Check formula follows the current stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_release.py --check

  install-and-upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Locate Homebrew
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
      - name: Clean install, runtime smoke, and upgrade preservation
        shell: bash
        run: bash scripts/test_formula.sh
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formula-evidence-${{ matrix.os }}
          path: artifacts/reports/
